services:
  coven-prover:
    image: ghcr.io/nftkingiii/coven-prover:latest
    init: true
    restart: unless-stopped
    environment:
      PORT: "8080"
      PROVER_THREADS: "2"
      PHALA_CVM: "true"
      COVEN_WEB_ORIGIN: "http://localhost:5173"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - "8080:8080"
