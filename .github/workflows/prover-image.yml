name: Prover image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/prover/**"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.phala.yml"
      - ".github/workflows/prover-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/prover/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coven-prover:latest
          platforms: linux/amd64
